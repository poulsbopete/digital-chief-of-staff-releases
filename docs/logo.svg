<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Digital Chief of Staff">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1533"/>
      <stop offset="45%" stop-color="#0F3D5E"/>
      <stop offset="100%" stop-color="#007871"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B8F0EA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEC514"/>
      <stop offset="100%" stop-color="#F04E98"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="shine" cx="30%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App icon canvas -->
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="226" fill="url(#shine)"/>

  <!-- Subtle grid / digital field -->
  <g opacity="0.12" stroke="#7DE8DD" stroke-width="2">
    <path d="M180 360h664M180 512h664M180 664h664"/>
    <path d="M360 180v664M512 180v664M664 180v664"/>
  </g>

  <!-- Network nodes -->
  <g fill="#5FE9DC" opacity="0.85">
    <circle cx="248" cy="280" r="10"/>
    <circle cx="776" cy="280" r="10"/>
    <circle cx="248" cy="744" r="10"/>
    <circle cx="776" cy="744" r="10"/>
  </g>
  <g stroke="#5FE9DC" stroke-width="3" opacity="0.35">
    <line x1="248" y1="280" x2="512" y2="360"/>
    <line x1="776" y1="280" x2="512" y2="360"/>
    <line x1="248" y1="744" x2="512" y2="664"/>
    <line x1="776" y1="744" x2="512" y2="664"/>
  </g>

  <!-- Shield / chief-of-staff badge -->
  <path d="M512 248 L704 330 V520 C704 648 620 736 512 792 C404 736 320 648 320 520 V330 Z"
        fill="url(#shield)" filter="url(#glow)"/>

  <!-- Brief stack (documents / briefs) -->
  <g fill="#0F3D5E">
    <rect x="430" y="430" width="164" height="18" rx="9"/>
    <rect x="430" y="468" width="164" height="18" rx="9"/>
    <rect x="430" y="506" width="124" height="18" rx="9"/>
  </g>

  <!-- Pulse / intelligence line -->
  <path d="M430 580 H470 L490 540 L520 620 L550 500 L580 580 H650"
        fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- DC monogram -->
  <text x="512" y="410" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="92" font-weight="700" letter-spacing="-2" fill="#0F3D5E">DC</text>

  <!-- Spark accent -->
  <circle cx="688" cy="336" r="18" fill="url(#accent)"/>
  <path d="M688 308 V364 M674 336 H702" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
</svg>
